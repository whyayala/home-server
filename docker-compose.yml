  plex:
    image: quay.io/linuxserver.io/plex:amd64-latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PLEX_UID:-1000}
      - PGID=${PLEX_GID:-1000}
      - TZ=${PLEX_TZ:-America/Chicago}
      - VERSION=docker
      # Hardware transcoding for AMD GPU
      - LIBVA_DRIVER_NAME=radeonsi
      - GPU_DRIVER=amd
      # PLEX_CLAIM only needed for initial setup - remove after first run for security
    volumes:
      - /media/volume/plex/config:/config
      - /media/volume/plex/data/temp:/data/temp
      - /media/volume/plex/transcode:/transcode
      - /media/Plex:/data/Plex
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "110"  # render group for GPU access
      - "44"   # video group for GPU access
    restart: unless-stopped

