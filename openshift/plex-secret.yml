# Template — actual values are injected by openshift-up.sh via envsubst.
# Do NOT commit this file with real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: plex-env
  namespace: home-server
  labels:
    app: plex
type: Opaque
stringData:
  PUID: "${PLEX_UID}"
  PGID: "${PLEX_GID}"
  TZ: "${PLEX_TZ}"
